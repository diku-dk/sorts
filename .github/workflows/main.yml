name: CI

on:
  pull_request:
    branches: [ master ]

  push:
    branches: [ master ]

jobs:
  test-on-latest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: diku-dk/install-futhark@v1.1.0
      with:
        version: 'latest'

    - run: futhark pkg sync

    - run: futhark test --pass-compiler-option=--Werror lib

    - run: futhark pkg upgrade

    - run: futhark pkg sync

    - run: futhark test --pass-compiler-option=--Werror lib
